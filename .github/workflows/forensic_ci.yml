name: iOS Keychain Correlator Forensic CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    name: Test Suite on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libsqlcipher-dev libssl-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e .

      - name: Generate Synthetic Forensic Test Fixtures
        run: |
          python harness/make_fake_extraction.py --out out/fake

      - name: Run Pytest Forensic Test Suite
        shell: bash
        run: |
          if python -m pytest -v tests/ --tb=short > test_failure.txt 2>&1; then
            cat test_failure.txt
          else
            cat test_failure.txt
            if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.python-version }}" = "3.12" ]; then
              git config user.name "CI Bot"
              git config user.email "ci@bot.com"
              git checkout -B ci-logs
              git add -f test_failure.txt
              git commit -m "ci: capture failed test log" || true
              git push -f origin ci-logs || true
            fi
            exit 1
          fi

      - name: Verify CLI Ingestion & Decryption Pipeline
        run: |
          python -m correlator.cli --help
