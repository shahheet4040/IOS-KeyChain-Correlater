name: iOS Keychain Correlator Forensic CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libsqlcipher-dev libssl-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e .

      - name: Generate Synthetic Forensic Test Fixtures
        run: |
          python harness/make_fake_extraction.py --out out/fake

      - name: Run Pytest Forensic Test Suite
        id: run_pytest
        shell: bash
        run: |
          python -m pytest -v tests/ --tb=short 2>&1 | tee test_results.log

      - name: Report Pytest Failures in Summary
        if: always()
        shell: bash
        run: |
          echo "### Forensic Test Suite Output (${{ matrix.os }} / Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 80 test_results.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.run_pytest.outcome }}" != "success" ]; then
            exit 1
          fi

      - name: Verify CLI Ingestion & Decryption Pipeline
        run: |
          python -m correlator.cli --help
