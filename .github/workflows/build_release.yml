name: Build Standalone Windows Executable Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  build-windows:
    name: Build Standalone Windows .exe (PyInstaller)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib
          pip install -e .

      - name: Build Standalone Executable & Release Bundle
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python build_exe.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IOSCorrelator-Windows-x64
          path: |
            dist/IOSCorrelator.exe
            dist/IOSCorrelator-v2.4-Windows-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release & Attach Binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/IOSCorrelator.exe
            dist/IOSCorrelator-v2.4-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
